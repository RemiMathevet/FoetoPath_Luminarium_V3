<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoetoPath — Vérification 2FA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --surface: #181a23;
  --surface2: #1e2130;
  --border: #2a2d3e;
  --text: #e8eaf0;
  --text2: #9498ab;
  --muted: #5f6378;
  --accent: #7c6aef;
  --accent-hover: #6b5ad6;
  --danger: #f87171;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  width: 400px;
  max-width: 90vw;
}
.card-header {
  text-align: center;
  margin-bottom: 28px;
}
.card-header h1 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}
.card-header p {
  color: var(--text2);
  font-size: 14px;
  line-height: 1.5;
}
.shield-icon {
  font-size: 36px;
  margin-bottom: 12px;
  display: block;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  padding: 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 22px;
  font-family: 'DM Sans', monospace;
  text-align: center;
  letter-spacing: 0.3em;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus {
  border-color: var(--accent);
}
.form-group input::placeholder {
  font-size: 15px;
  letter-spacing: normal;
}
.btn {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 4px;
}
.btn:hover { background: var(--accent-hover); }
.error-msg {
  background: rgba(248,113,113,0.1);
  border: 1px solid rgba(248,113,113,0.3);
  color: var(--danger);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 20px;
  text-align: center;
}
.hint {
  text-align: center;
  margin-top: 16px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}
.user-tag {
  display: inline-block;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 10px;
  font-size: 13px;
  color: var(--accent);
  margin-bottom: 8px;
}
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <span class="shield-icon">&#x1F510;</span>
    <h1 data-i18n="auth.totp_verify_title">Vérification 2FA</h1>
    <span class="user-tag">{{ session.get('username', '') }}</span>
    <p data-i18n="auth.totp_verify_subtitle">Saisissez le code à 6 chiffres<br>de votre application d'authentification</p>
  </div>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/auth/totp" autocomplete="off">
    <div class="form-group">
      <label for="code" data-i18n="auth.totp_verification_label">Code de vérification</label>
      <input type="text" id="code" name="code"
             inputmode="numeric" pattern="[0-9A-Za-z]*"
             maxlength="10" autofocus required
             placeholder="000 000"
             data-i18n-placeholder="auth.totp_placeholder"
             autocomplete="one-time-code">
    </div>

    <button type="submit" class="btn" data-i18n="auth.verify">Vérifier</button>
  </form>

  <p class="hint" data-i18n="auth.totp_recovery_hint">
    Vous pouvez aussi utiliser un code de récupération.
  </p>
</div>

<script src="/static/i18n.js"></script>
<script>i18nInit().then(function() { i18nApply(); });</script>

</body>
</html>
